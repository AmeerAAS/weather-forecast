apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-weather-app
  labels:
    app: live-weather-app
  annotations:
    image.openshift.io/triggers: |-
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "live-weather-app:latest"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name=='weather-container')].image"
        }
      ]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-weather-app
  template:
    metadata:
      labels:
        app: live-weather-app
    spec:
      containers:
        - name: weather-container
          image: live-weather-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: weather-api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
